<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d1b54"/>
      <stop offset="1" stop-color="#0d0718"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b79bff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#b79bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" x1="0" x2="1">
      <stop offset="0" stop-color="#9c85f0"/>
      <stop offset="1" stop-color="#f1ecff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#9c85f0" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="128" cy="128" r="104" fill="url(#glow)"/>
  <!-- 실타래(감긴 실) 겸 나이테(결) — 하나의 나선으로 겹쳐 감은 모양 -->
  <path d="M128 56 a72 72 0 1 1 -62 107" fill="none" stroke="url(#thread)" stroke-width="10" stroke-linecap="round"/>
  <path d="M128 74 a54 54 0 1 0 -47 80" fill="none" stroke="url(#thread)" stroke-width="10" stroke-linecap="round" stroke-opacity=".85"/>
  <path d="M128 92 a36 36 0 1 1 -31 54" fill="none" stroke="url(#thread)" stroke-width="10" stroke-linecap="round" stroke-opacity=".7"/>
  <circle cx="128" cy="128" r="11" fill="#fff"/>
  <circle cx="128" cy="128" r="21" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="3"/>
</svg>
